{% extends "base.html" %}

{% block content %}
<div class="chat-container">
    <div id="chatBox" class="chat-box"></div>
    <div class="input-area">
        <textarea id="question" placeholder="Describe an architectural evolution concern..."></textarea>
        <button id="sendButton">Send</button>
        <button id="clearButton" class="btn-clear">Clear history</button>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const input = document.getElementById("question");
    const chatBox = document.getElementById("chatBox");
    const sendButton = document.getElementById("sendButton");
    const clearButton = document.getElementById("clearButton");

    function saveChat() {
        localStorage.setItem("arcassistChatHistory", chatBox.innerHTML);
    }

    function loadChat() {
        const history = localStorage.getItem("arcassistChatHistory");
        if (history) {
            chatBox.innerHTML = history;
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    }

    function clearChat() {
        localStorage.removeItem("arcassistChatHistory");
        chatBox.innerHTML = "";
    }

    async function submitQuestion() {
        const question = input.value.trim();
        if (!question) return;

        const userMessage = document.createElement("div");
        userMessage.className = "msg user";
        userMessage.innerText = question;
        chatBox.appendChild(userMessage);
        saveChat();

        input.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;

        const typingIndicator = document.createElement("div");
        typingIndicator.className = "typing";
        typingIndicator.innerHTML = "<span></span><span></span><span></span>";
        chatBox.appendChild(typingIndicator);
        chatBox.scrollTop = chatBox.scrollHeight;

        const response = await fetch("/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question: question })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";

        chatBox.removeChild(typingIndicator);

        const assistantMessage = document.createElement("div");
        assistantMessage.className = "msg assistant";
        chatBox.appendChild(assistantMessage);

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            assistantMessage.innerText = buffer;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        saveChat();
    }

    loadChat();
    sendButton.addEventListener("click", submitQuestion);
    clearButton.addEventListener("click", clearChat);
    input.addEventListener("keydown", function (event) {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            submitQuestion();
        }
    });
});
</script>
{% endblock %}
